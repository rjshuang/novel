name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: 386
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.0'
        
    - name: Get dependencies
      run: |
        go mod tidy
        
    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        if [ "${{ matrix.goos }}" = "windows" ]; then
          go build -o novel-${{ matrix.goos }}-${{ matrix.goarch }}.exe .
        else
          go build -o novel-${{ matrix.goos }}-${{ matrix.goarch }} .
        fi
        
    - name: Prepare distribution folder
      run: |
        mkdir -p dist-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          cp novel-${{ matrix.goos }}-${{ matrix.goarch }}.exe dist-${{ matrix.goos }}-${{ matrix.goarch }}/
        else
          cp novel-${{ matrix.goos }}-${{ matrix.goarch }} dist-${{ matrix.goos }}-${{ matrix.goarch }}/  
        fi
        cp conf.json dist-${{ matrix.goos }}-${{ matrix.goarch }}/
        mkdir -p dist-${{ matrix.goos }}-${{ matrix.goarch }}/static/
        cp static/cover.css dist-${{ matrix.goos }}-${{ matrix.goarch }}/static/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: novel-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist-${{ matrix.goos }}-${{ matrix.goarch }}/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        
    - name: Prepare release assets
      run: |
        cd ./artifacts
        for dir in */; do
          if ls "$dir"*.exe >/dev/null 2>&1; then
            (cd "$dir" && zip -r "../${dir%/}.zip" ./*)
          else
            (cd "$dir" && tar -czf "../${dir%/}.tar.gz" ./*)
          fi
        done
        
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./artifacts/*.zip
          ./artifacts/*.tar.gz